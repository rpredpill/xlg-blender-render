name: Nani site smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nani-site-smoke.yml'
      - '.github/workflows/nani-signal.yml'
      - 'tools/nani_live.py'
      - 'tools/nani_live_v2.py'
      - 'tools/nani_ndx_source.py'
  workflow_run:
    workflows: ['Refresh Nani signal and history']
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages

      - name: JavaScript syntax
        run: |
          node --check nani-extension.js
          node --check nani-history-sync.js
          node --check nani-live-fix.js

      - name: Validate Nani v2 wiring and data
        shell: python
        run: |
          import json, math
          from pathlib import Path

          index=Path('index.html').read_text(encoding='utf-8')
          for name in ['nani-extension.js?v=2','nani-history-sync.js?v=2','nani-live-fix.js?v=2']:
              if name not in index:
                  raise RuntimeError(f'{name} not wired in index.html')

          latest=json.loads(Path('nani-latest.json').read_text(encoding='utf-8'))
          if latest.get('strategy')!='Nani' or latest.get('version')!='2.0' or latest.get('ready') is not True:
              raise RuntimeError(f'Nani v2 latest not ready: strategy={latest.get("strategy")} version={latest.get("version")} ready={latest.get("ready")}')
          rows=latest.get('rows') or []
          if len(rows)<315:
              raise RuntimeError(f'Nani holdings too small: {len(rows)}')
          total=sum(float(r['weight']) for r in rows)
          if not math.isfinite(total) or abs(total-1.0)>1e-8:
              raise RuntimeError(f'Nani weight sum {total}')

          rules=latest.get('rules') or {}
          if rules.get('singleNameCap') is not None:
              raise RuntimeError(f'Nani v2 unexpectedly has cap: {rules.get("singleNameCap")}')
          if rules.get('rebalanceCadence') is not None:
              raise RuntimeError(f'Nani v2 unexpectedly has cadence: {rules.get("rebalanceCadence")}')

          us=[r for r in rows if r.get('country')=='US']
          jp=[r for r in rows if r.get('country')=='JP']
          d=latest.get('diagnostics') or {}
          if len(us)!=int(d.get('nasdaqCount') or -1):
              raise RuntimeError(f'US count mismatch rows={len(us)} diag={d.get("nasdaqCount")}')
          if len(jp)!=225 or int(d.get('nikkeiCount') or -1)!=225:
              raise RuntimeError(f'JP count mismatch rows={len(jp)} diag={d.get("nikkeiCount")}')
          if len(rows)!=int(d.get('unionCount') or -1):
              raise RuntimeError(f'union count mismatch rows={len(rows)} diag={d.get("unionCount")}')
          if int(d.get('ndxSourceCount') or -1)!=len(us):
              raise RuntimeError(f'NDX source count mismatch source={d.get("ndxSourceCount")} rows={len(us)}')

          checked=0
          for r in rows:
              fc=r.get('floatCap'); rm=r.get('relativeMomentum'); raw=r.get('rawWeightScore')
              if all(isinstance(v,(int,float)) and math.isfinite(float(v)) for v in [fc,rm,raw]):
                  expected=float(fc)*(float(rm)**3)
                  if not math.isclose(float(raw),expected,rel_tol=1e-10,abs_tol=max(1e-4,abs(expected)*1e-12)):
                      raise RuntimeError(f'raw score mismatch {r.get("ticker")}: {raw} vs {expected}')
                  checked+=1
          if checked<300:
              raise RuntimeError(f'only {checked} rows have verifiable raw score')

          hist=json.loads(Path('nani-history.json').read_text(encoding='utf-8'))
          if hist.get('version')!='2.0':
              raise RuntimeError(f'Nani history is not v2: {hist.get("version")}')
          months=hist.get('months') or {}
          for m,rec in months.items():
              if not isinstance(rec,dict) or rec.get('provenance')!='forward-live-v2':
                  raise RuntimeError(f'non-forward record remains at {m}')
              rrows=rec.get('rows') or []
              if not rrows:
                  raise RuntimeError(f'{m} rows missing')
              wsum=sum(float(x.get('weight',0)) for x in rrows)
              if not math.isclose(wsum,1.0,rel_tol=0,abs_tol=2e-8):
                  raise RuntimeError(f'{m} history weight sum {wsum}')
              if isinstance(rec.get('portfolioReturn'),(int,float)) and float(rec.get('coverageRatio',0))<0.98:
                  raise RuntimeError(f'{m} completed coverage too low: {rec.get("coverageRatio")}')

          completed=[m for m,r in months.items() if isinstance(r.get('portfolioReturn'),(int,float))]
          pending=[m for m,r in months.items() if not isinstance(r.get('portfolioReturn'),(int,float))]
          if any(m in months for m in ['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09']):
              raise RuntimeError('retroactive v1 2026-04..09 record survived into v2')

          print('Nani v2 smoke OK')
          print('holdings',len(rows),'US',len(us),'JP',len(jp),'weightSum',total,'maxWeight',latest.get('maxWeight'))
          print('formulaRowsChecked',checked)
          print('history completed',completed,'pending',pending)
