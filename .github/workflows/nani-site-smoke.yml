name: Nani site smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nani-site-smoke.yml'
      - '.github/workflows/nani-signal.yml'
      - 'tools/nani_live.py'
      - 'tools/nani_live_v2.py'
      - 'tools/nani_live_v4.py'
      - 'tools/nani_ndx_source.py'
  workflow_run:
    workflows: ['Refresh Nani signal and history']
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages

      - name: JavaScript syntax
        run: |
          node --check nani-extension.js
          node --check nani-history-sync.js
          node --check nani-live-fix.js

      - name: Validate Nani v4 wiring and data
        shell: python
        run: |
          import json, math
          from pathlib import Path

          index=Path('index.html').read_text(encoding='utf-8')
          for name in ['nani-extension.js?v=4','nani-history-sync.js?v=4','nani-live-fix.js?v=4']:
              if name not in index:
                  raise RuntimeError(f'{name} not wired in index.html')

          latest=json.loads(Path('nani-latest.json').read_text(encoding='utf-8'))
          if latest.get('strategy')!='Nani' or latest.get('version')!='4.0' or latest.get('ready') is not True:
              raise RuntimeError(f'Nani v4 latest not ready: strategy={latest.get("strategy")} version={latest.get("version")} ready={latest.get("ready")}')
          rows=latest.get('rows') or []
          total=sum(float(r['weight']) for r in rows)
          if not math.isclose(total,1.0,rel_tol=0,abs_tol=1e-8):
              raise RuntimeError(f'Nani weight sum {total}')

          rules=latest.get('rules') or {}
          if rules.get('countryAllocation')!='Japan 50% / US 50%':
              raise RuntimeError(f'country allocation rule mismatch: {rules.get("countryAllocation")}')
          if rules.get('coreWeighting')!='Float-Adjusted Market Cap only' or rules.get('momentum') is not None:
              raise RuntimeError(f'Nani v4 is not float-cap-only: {rules}')
          if rules.get('singleNameCap') is not None:
              raise RuntimeError(f'Nani v4 unexpectedly has cap: {rules.get("singleNameCap")}')
          if rules.get('rebalanceCadence') is not None:
              raise RuntimeError(f'Nani v4 unexpectedly has cadence: {rules.get("rebalanceCadence")}')

          us=[r for r in rows if r.get('country')=='US']
          jp=[r for r in rows if r.get('country')=='JP']
          d=latest.get('diagnostics') or {}
          if len(jp)!=100 or int(d.get('nikkei100Count') or -1)!=100:
              raise RuntimeError(f'JP100 mismatch rows={len(jp)} diag={d.get("nikkei100Count")}')
          if int(d.get('nikkeiSourceCount') or -1)!=225:
              raise RuntimeError(f'Nikkei top100 source count mismatch {d.get("nikkeiSourceCount")}')
          if len(us)!=int(d.get('nasdaqCount') or -1) or len(us)!=int(d.get('ndxSourceCount') or -1):
              raise RuntimeError(f'US count mismatch rows={len(us)} diag={d.get("nasdaqCount")} source={d.get("ndxSourceCount")}')
          if len(rows)!=len(jp)+len(us) or len(rows)!=int(d.get('unionCount') or -1):
              raise RuntimeError(f'union count mismatch rows={len(rows)} diag={d.get("unionCount")}')

          jp_weight=sum(float(r['weight']) for r in jp)
          us_weight=sum(float(r['weight']) for r in us)
          if not math.isclose(jp_weight,0.5,rel_tol=0,abs_tol=1e-8) or not math.isclose(us_weight,0.5,rel_tol=0,abs_tol=1e-8):
              raise RuntimeError(f'country bucket mismatch JP={jp_weight} US={us_weight}')

          checked=0
          for r in rows:
              fc=r.get('floatCap'); raw=r.get('rawWeightScore')
              if all(isinstance(v,(int,float)) and math.isfinite(float(v)) for v in [fc,raw]):
                  expected=float(fc)
                  if not math.isclose(float(raw),expected,rel_tol=1e-12,abs_tol=max(1e-4,abs(expected)*1e-12)):
                      raise RuntimeError(f'raw score mismatch {r.get("ticker")}: {raw} vs {expected}')
                  if any(k in r for k in ['momentum','grossMomentum','relativeMomentum','earlyPrice']):
                      raise RuntimeError(f'momentum field survived in v4 row {r.get("ticker")}')
                  checked+=1
          if checked!=len(rows):
              raise RuntimeError(f'formula rows checked {checked}/{len(rows)}')

          hist=json.loads(Path('nani-history.json').read_text(encoding='utf-8'))
          if hist.get('version')!='4.0':
              raise RuntimeError(f'Nani history is not v4: {hist.get("version")}')
          months=hist.get('months') or {}
          for m,rec in months.items():
              if not isinstance(rec,dict) or rec.get('provenance')!='forward-live-v4':
                  raise RuntimeError(f'non-v4 forward record remains at {m}')
              rrows=rec.get('rows') or []
              if not rrows:
                  raise RuntimeError(f'{m} rows missing')
              rjp=[x for x in rrows if x.get('country')=='JP']
              rus=[x for x in rrows if x.get('country')=='US']
              if len(rjp)!=100:
                  raise RuntimeError(f'{m} JP count {len(rjp)}')
              jpw=sum(float(x.get('weight',0)) for x in rjp)
              usw=sum(float(x.get('weight',0)) for x in rus)
              if not math.isclose(jpw,0.5,rel_tol=0,abs_tol=2e-8) or not math.isclose(usw,0.5,rel_tol=0,abs_tol=2e-8):
                  raise RuntimeError(f'{m} country bucket mismatch JP={jpw} US={usw}')
              if isinstance(rec.get('portfolioReturn'),(int,float)) and float(rec.get('coverageRatio',0))<0.98:
                  raise RuntimeError(f'{m} completed coverage too low: {rec.get("coverageRatio")}')

          completed=[m for m,r in months.items() if isinstance(r.get('portfolioReturn'),(int,float))]
          pending=[m for m,r in months.items() if not isinstance(r.get('portfolioReturn'),(int,float))]
          print('Nani v4 smoke OK')
          print('holdings',len(rows),'US',len(us),'JP',len(jp),'JPWeight',jp_weight,'USWeight',us_weight,'maxWeight',latest.get('maxWeight'))
          print('floatOnlyRowsChecked',checked)
          print('history completed',completed,'pending',pending)
