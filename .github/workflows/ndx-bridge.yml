name: Build NDX bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_ndx_membership_and_bench_bundle.py'
      - '.github/workflows/ndx-bridge.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check yfinance pandas requests
      - run: python tools/build_ndx_membership_and_bench_bundle.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ndx-bridge.b85
          git commit -m 'Publish compact NDX bridge' || exit 0
          git push origin HEAD:main
