name: Build exact QUU overlap compact
on:
  push:
    paths:
      - 'tools/quu_exact_overlap_compact.py'
      - '.github/workflows/quu-exact-overlap-compact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - run: python tools/quu_exact_overlap_compact.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quu-exact-overlap-compact.json
          git commit -m 'Publish compact exact QUU overlap' || exit 0
          git push origin HEAD:main
