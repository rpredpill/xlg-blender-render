name: Probe Stooq US bulk prices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stooq-bulk-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Stooq bulk ZIP
        shell: python
        run: |
          import io, os, zipfile, requests, re
          url='https://static.stooq.com/db/h/d_us_txt.zip'
          r=requests.get(url, timeout=180, headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS', r.status_code)
          print('TYPE', r.headers.get('content-type'))
          print('BYTES', len(r.content))
          print('HEAD', r.content[:8])
          r.raise_for_status()
          if not r.content.startswith(b'PK'):
              raise RuntimeError('not zip')
          z=zipfile.ZipFile(io.BytesIO(r.content))
          names=z.namelist()
          print('FILES', len(names))
          print('FIRST20', names[:20])
          matches=[n for n in names if re.search(r'(?i)(^|/)aapl\.us\.txt$', n)]
          print('AAPL_MATCH', matches[:10])
          if matches:
              raw=z.read(matches[0]).decode('utf-8', errors='replace')
              lines=raw.splitlines()
              print('AAPL_LINES', len(lines))
              print('AAPL_HEAD', lines[:5])
              print('AAPL_TAIL', lines[-5:])
          # Also inspect a few exact symbol basename patterns.
          basenames={os.path.basename(n).lower():n for n in names}
          for sym in ['msft.us.txt','meta.us.txt','fb.us.txt','qqq.us.txt','bbby.us.txt','abmd.us.txt']:
              n=basenames.get(sym)
              print('SYMBOL', sym, 'FOUND', bool(n), 'PATH', n)
              if n:
                  lines=z.read(n).decode('utf-8', errors='replace').splitlines()
                  print('  HEAD', lines[:2])
                  print('  TAIL', lines[-2:])
