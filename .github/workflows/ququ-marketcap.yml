name: Refresh QUQU market cap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ququ-marketcap.yml'
  schedule:
    - cron: '20 2 2 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check yfinance requests

      - name: Build latest QUQU market-cap snapshot
        shell: python
        run: |
          import csv, io, json, math, re, time
          from datetime import datetime, timezone
          import requests
          import yfinance as yf

          MEMBERS_URL = 'https://raw.githubusercontent.com/thaywebsearch/nasdaq100-list/main/nasdaq100-table.csv'
          FALLBACK_URL = 'https://raw.githubusercontent.com/thaywebsearch/nasdaq100-list/main/nasdaq100_marketcap_052026.csv'
          HEADERS = {'User-Agent': 'Mozilla/5.0 QUQU-marketcap-refresh/1.0'}

          def get_text(url):
              r = requests.get(url, headers=HEADERS, timeout=30)
              r.raise_for_status()
              return r.text

          def parse_cap(v):
              s = str(v or '').strip().replace('$','').replace(',','').upper()
              m = re.fullmatch(r'([0-9]*\.?[0-9]+)([TBMK]?)', s)
              if not m:
                  return None
              n = float(m.group(1))
              mult = {'T':1e12,'B':1e9,'M':1e6,'K':1e3,'':1}[m.group(2)]
              return n * mult

          member_rows = list(csv.DictReader(io.StringIO(get_text(MEMBERS_URL))))
          old_rows = list(csv.DictReader(io.StringIO(get_text(FALLBACK_URL))))
          old_caps = {}
          for r in old_rows:
              t = str(r.get('ticker','')).strip().upper().replace('-', '.')
              cap = parse_cap(r.get('market_cap_usd'))
              if t and cap:
                  old_caps[t] = cap

          members = []
          seen = set()
          for r in member_rows:
              t = str(r.get('ticker','')).strip().upper().replace('-', '.')
              if not t or t in seen:
                  continue
              seen.add(t)
              members.append((t, str(r.get('company','')).strip()))

          if len(members) < 100:
              raise RuntimeError(f'Only {len(members)} Nasdaq-100 members found')
          members = members[:100]

          rows = []
          failures = []
          fallback_tickers = []
          for ticker, company in members:
              cap = None
              try:
                  q = yf.Ticker(ticker)
                  try:
                      cap = q.fast_info.get('market_cap')
                  except Exception:
                      cap = None
                  if not cap:
                      try:
                          cap = q.info.get('marketCap')
                      except Exception:
                          cap = None
                  cap = float(cap) if cap is not None else None
              except Exception:
                  cap = None

              if cap is None or not math.isfinite(cap) or cap <= 0:
                  cap = old_caps.get(ticker)
                  if cap:
                      fallback_tickers.append(ticker)
                  else:
                      failures.append(ticker)
                      continue

              rows.append({'ticker': ticker, 'company': company, 'marketCap': float(cap)})
              time.sleep(0.02)

          if len(rows) != 100:
              raise RuntimeError(f'Only {len(rows)}/100 market caps; failures={failures}')

          # Preserve the Nasdaq-100 membership set. Rank here is informational only;
          # QUQU itself owns all 100 and uses the score only for capital allocation.
          for rank, row in enumerate(rows, 1):
              row['rank'] = rank

          payload = {
              'strategy': 'QUQU',
              'universe': 'Nasdaq-100',
              'holdings': 100,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceMembership': 'thaywebsearch/nasdaq100-list nasdaq100-table.csv',
              'sourceMarketCap': 'Yahoo Finance via yfinance',
              'fallbackMarketCapSource': 'nasdaq100_marketcap_052026.csv',
              'fallbackTickers': fallback_tickers,
              'failedTickers': failures,
              'rows': rows,
          }
          with open('ququ-latest.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

      - name: Commit snapshot to Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ququ-latest.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Refresh QUQU market cap snapshot'
            git push origin HEAD:somx-pages
          fi
