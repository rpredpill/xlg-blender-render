name: Refresh QUQU v2 signal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ququ-marketcap.yml'
      - 'tools/ququ_v2_live.py'
      - 'tools/ququ_v2_ablation.py'
      - 'tools/ququ_v2_bulk_data.py'
  schedule:
    - cron: '20 2 2 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas yfinance requests duckdb

      - name: Load QUQU v2 production engine from main
        run: |
          git show origin/main:tools/ququ_v2_ablation.py > /tmp/ququ_v2_ablation.py
          git show origin/main:tools/ququ_v2_bulk_data.py > /tmp/ququ_v2_bulk_data.py
          git show origin/main:tools/ququ_v2_live.py > /tmp/ququ_v2_live.py
          python -m py_compile /tmp/ququ_v2_ablation.py /tmp/ququ_v2_bulk_data.py /tmp/ququ_v2_live.py

      - name: Build QUQU v2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s nasdaq-composite-pit.json
          export PYTHONPATH=/tmp
          python /tmp/ququ_v2_live.py \
            --pit nasdaq-composite-pit.json \
            --output ququ-latest.json \
            --workers 8

      - name: Validate production snapshot
        shell: python
        run: |
          import json, math
          p=json.load(open('ququ-latest.json', encoding='utf-8'))
          if p.get('strategy') != 'QUQU v2':
              raise RuntimeError(f"unexpected strategy {p.get('strategy')}")
          rows=p.get('rows') or []
          if len(rows) < 100:
              raise RuntimeError(f'only {len(rows)} holdings')
          if int(p.get('holdings') or 0) != len(rows):
              raise RuntimeError(f"holdings mismatch {p.get('holdings')} != {len(rows)}")
          total=sum(float(x['weight']) for x in rows)
          mx=max(float(x['weight']) for x in rows)
          if not math.isfinite(total) or abs(total-1.0) > 1e-8:
              raise RuntimeError(f'weight sum {total}')
          if mx > 0.20000001:
              raise RuntimeError(f'20% cap violation {mx}')
          d=p.get('diagnostics') or {}
          if not d.get('floatSelectionProven'):
              raise RuntimeError('float selection not proven')
          for key in ['signalMonth','allocationMonth','signalDate','earlyDate','freeDataCaveat']:
              if not p.get(key):
                  raise RuntimeError(f'missing {key}')
          print('strategy', p['strategy'])
          print('signal', p['signalMonth'], 'allocation', p['allocationMonth'])
          print('holdings', len(rows), 'weightSum', total, 'maxWeight', mx, 'top10', p.get('top10Weight'))
          print('PIT', d.get('pitEligibleCount'), 'top10Count', d.get('targetTop10Count'), 'liqRemoved', d.get('liquidityRemovedCount'), 'winsorClipped', d.get('winsorClippedCount'))

      - name: Commit snapshot to Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ququ-latest.json
          if git diff --cached --quiet; then
            echo 'No QUQU v2 snapshot changes'
          else
            git commit -m 'Refresh QUQU v2 signal snapshot'
            git push origin HEAD:somx-pages
          fi
