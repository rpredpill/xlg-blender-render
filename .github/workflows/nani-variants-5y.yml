name: Nani Variants 5Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nani-variants-5y.yml'
      - 'tools/nani_compare_variants_5y.py'
      - 'tools/nani_backtest_5y.py'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas yfinance requests lxml
      - name: Run variant backtest
        run: python tools/nani_compare_variants_5y.py
      - name: Validate
        shell: python
        run: |
          import json, math
          p=json.load(open('research/nani_variants_vs_qqq_5y.json',encoding='utf-8'))
          assert p['period']['months']==60
          assert len(p['equityCurve'])==60
          assert set(p['metrics'])=={'base_m3','mr_off','float_only','m2','qqq'}
          assert p['meanReversionMonthCount']>0
          for k,v in p['metrics'].items():
              assert math.isfinite(v['totalReturn']) and math.isfinite(v['cagr'])
          print('metrics',json.dumps(p['metrics'],indent=2))
          print('ending',p['endingValue100'])
          print('MR months',p['meanReversionMonths'])
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nani_variants_vs_qqq_5y.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Nani five-variant 5Y comparison'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
