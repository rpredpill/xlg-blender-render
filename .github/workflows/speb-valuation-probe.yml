name: Probe historical valuation snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/speb-valuation-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check duckdb requests
      - name: Measure valuation snapshot coverage
        shell: python
        run: |
          import requests, duckdb, json
          url='https://huggingface.co/datasets/speb/financial-data/resolve/main/raw/stock_valuation_snapshot.parquet'
          pit_url='https://raw.githubusercontent.com/rpredpill/xlg-blender-render/somx-pages/nasdaq-composite-pit.json'
          con=duckdb.connect()
          con.execute('INSTALL httpfs; LOAD httpfs; SET threads=4;')
          print('SCHEMA',con.execute(f"DESCRIBE SELECT * FROM read_parquet('{url}')").fetchall())
          print('DATES',con.execute(f"SELECT min(report_date),max(report_date),count(*),count(distinct symbol) FROM read_parquet('{url}')").fetchall())
          r=requests.get(pit_url,timeout=60); r.raise_for_status(); pit=r.json()
          union=sorted({s for rec in pit['months'].values() for s in rec.get('symbols',[])})
          m2022=pit['months']['2022-12']['symbols']
          con.execute('CREATE TEMP TABLE pit_union(symbol VARCHAR)')
          con.executemany('INSERT INTO pit_union VALUES (?)',[(s,) for s in union])
          con.execute('CREATE TEMP TABLE pit_202212(symbol VARCHAR)')
          con.executemany('INSERT INTO pit_202212 VALUES (?)',[(s,) for s in m2022])
          latest=f"""SELECT * EXCLUDE(rn) FROM (
                        SELECT *,row_number() over(partition by upper(symbol) order by report_date desc) rn
                        FROM read_parquet('{url}')
                      ) WHERE rn=1"""
          for table,label in [('pit_union','UNION'),('pit_202212','2022_12')]:
              q=f"""SELECT
                      count(*) pit_n,
                      count(v.symbol) any_snapshot,
                      count(*) filter(where v.market_cap>0 and v.current_price>0) cap_price,
                      count(*) filter(where v.float_shares>0) float_shares,
                      count(*) filter(where v.market_cap>0 and v.current_price>0 and v.float_shares>0) full_proxy
                    FROM {table} p LEFT JOIN ({latest}) v ON upper(v.symbol)=p.symbol"""
              print(label,con.execute(q).fetchall())
          q=f"""SELECT symbol,report_date,market_cap,float_shares,current_price,
                       cast(market_cap as double)/nullif(cast(current_price as double),0) implied_shares,
                       cast(float_shares as double)/(cast(market_cap as double)/nullif(cast(current_price as double),0)) float_ratio
                 FROM ({latest})
                 WHERE upper(symbol) in ('AAPL','NVDA','META','ASML','PDD','ARM')
                 ORDER BY symbol"""
          print('SAMPLES',con.execute(q).fetchall())
          con.close()
