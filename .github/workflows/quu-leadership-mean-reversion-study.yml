name: QUU leadership mean reversion study

on:
  push:
    branches: [main]
    paths:
      - 'tools/quu_leadership_mean_reversion_study.py'
      - '.github/workflows/quu-leadership-mean-reversion-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Load study script
        run: git show origin/main:tools/quu_leadership_mean_reversion_study.py > /tmp/quu_leadership_mean_reversion_study.py

      - name: Run study
        run: python /tmp/quu_leadership_mean_reversion_study.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          j=json.load(open('quu-leadership-mean-reversion-study.json',encoding='utf-8'))
          assert j['exact2022_2026']['months'] >= 30
          assert j['pre2018Proxy']['months'] >= 60
          for sample in ['exact2022_2026','pre2018Proxy']:
              for cut in ['80','90','95']:
                  for h in ['1','2','3','6']:
                      assert 'allExtreme' in j[sample]['cuts'][cut][h]
          print(json.dumps({
              'exactRollover': j['exact2022_2026']['rolloverAggregate'],
              'proxyRollover': j['pre2018Proxy']['rolloverAggregate'],
          }, indent=2))
          PY

      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quu-leadership-mean-reversion-study.json
          git commit -m 'Update QUU leadership mean reversion study' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
