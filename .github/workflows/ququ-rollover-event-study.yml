name: QUQU rollover event study

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ququ-rollover-event-study.yml'
      - 'tools/ququ_rollover_event_study.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Load script
        run: git show origin/main:tools/ququ_rollover_event_study.py > /tmp/ququ_rollover_event_study.py
      - name: Run event study
        run: python /tmp/ququ_rollover_event_study.py
      - name: Validate
        shell: python
        run: |
          import json
          j=json.load(open('ququ-rollover-event-study.json',encoding='utf-8'))
          assert j['period']['months'] >= 36
          assert 'extreme_falling_rollover' in j['categories']
          print(json.dumps({'categories':j['categories'],'rolloverEvents':j['rolloverEvents'],'eventWindows':j['eventWindows']},indent=2))
      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ququ-rollover-event-study.json
          git commit -m 'Update QUQU rollover event study' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
