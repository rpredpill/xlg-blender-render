name: QUU overfit validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/validate_quu_overfit.py'
      - '.github/workflows/quu-overfit-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Load validation script
        run: git show origin/main:tools/validate_quu_overfit.py > /tmp/validate_quu_overfit.py
      - name: Run validation
        run: python /tmp/validate_quu_overfit.py
      - name: Validate output
        shell: python
        run: |
          import json
          j=json.load(open('quu-overfit-validation.json',encoding='utf-8'))
          assert j['period']['months'] >= 36
          assert 'twoSwitchExactPermutationTest' in j
          assert len(j['sensitivity']) >= 10
          print(json.dumps({
            'period':j['period'],
            'headline':j['headline'],
            'eventDependence':j['eventDependence'],
            'twoSwitchExactPermutationTest':j['twoSwitchExactPermutationTest'],
            'sensitivity':j['sensitivity'],
            'subperiods':j['subperiods'],
          },indent=2))
      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quu-overfit-validation.json
          git commit -m 'Update QUU overfit validation' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
