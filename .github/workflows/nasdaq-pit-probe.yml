name: Probe Nasdaq PIT workbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasdaq-pit-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests openpyxl
      - name: Probe 2022-12
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_nasdaq_composite_pit.py --start 2022-12 --end 2022-12 --output /tmp/probe.json --sleep 0
          python - <<'PY'
          import json
          p=json.load(open('/tmp/probe.json'))
          r=p['months']['2022-12']
          s=set(r['symbols'])
          print('RAW_COUNT', r['rawCount'])
          print('ELIGIBLE_COUNT', r['count'])
          print('ETF_EXCLUDED', r['excludedETFCount'], r['excludedETFSample'])
          print('SUFFIX_EXCLUDED', r['excludedSuffixCount'], r['excludedSuffixSample'])
          print('ETF_UNKNOWN', r['etfFlagUnknownCount'])
          print('QQQ_PRESENT', 'QQQ' in s)
          print('TQQQ_PRESENT', 'TQQQ' in s)
          print('AAPL_PRESENT', 'AAPL' in s)
          PY
