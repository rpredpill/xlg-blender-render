name: Probe Nasdaq PIT workbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasdaq-pit-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests openpyxl
      - name: Probe 2022-12
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_nasdaq_composite_pit.py --start 2022-12 --end 2022-12 --output /tmp/probe.json --sleep 0
          python - <<'PY'
          import json
          p=json.load(open('/tmp/probe.json'))
          r=p['months']['2022-12']
          print('COUNT', r['count'])
          print('FIRST50', r['symbols'][:50])
          print('DIAGNOSTICS', json.dumps(r['parserDiagnostics'], indent=2))
          PY
