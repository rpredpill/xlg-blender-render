name: QUU rollover residual-level study

on:
  push:
    paths:
      - 'tools/quu_rollover_level_study.py'
      - '.github/workflows/quu-rollover-level-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0
      - name: Load study script
        run: git show origin/main:tools/quu_rollover_level_study.py > /tmp/quu_rollover_level_study.py
      - name: Run study
        run: python /tmp/quu_rollover_level_study.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          j=json.load(open('quu-rollover-level-study.json',encoding='utf-8'))
          assert j['exact2022_2026']['events'] == 5
          assert j['pre2018Proxy']['events'] == 9
          print(json.dumps({
            'exactPearson':j['exact2022_2026']['pearsonCurrentPercentileVsExcess'],
            'exactSpearman':j['exact2022_2026']['spearmanCurrentPercentileVsExcess'],
            'proxyPearson':j['pre2018Proxy']['pearsonCurrentPercentileVsExcess'],
            'proxySpearman':j['pre2018Proxy']['spearmanCurrentPercentileVsExcess'],
            'signReplication':j['crossSampleSignReplication']
          },indent=2))
          PY
      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quu-rollover-level-study.json
          git commit -m 'Update QUU rollover residual-level study' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
