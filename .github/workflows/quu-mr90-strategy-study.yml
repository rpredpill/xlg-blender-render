name: QUU MR90 strategy study

on:
  push:
    branches: [main]
    paths:
      - 'tools/quu_mr90_strategy_study.py'
      - '.github/workflows/quu-mr90-strategy-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Load study script
        run: git show origin/main:tools/quu_mr90_strategy_study.py > /tmp/quu_mr90_strategy_study.py

      - name: Run study
        run: python /tmp/quu_mr90_strategy_study.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          j=json.load(open('quu-mr90-strategy-study.json',encoding='utf-8'))
          assert j['exact2022_2026_commonWindow']['period']['months'] >= 30
          assert j['pre2018Proxy_commonWindow']['period']['months'] >= 60
          assert j['exact2022_2026_commonWindow']['mr90']['count'] >= 1
          print(json.dumps({
              'exact': j['exact2022_2026_commonWindow'],
              'pre': j['pre2018Proxy_commonWindow'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quu-mr90-strategy-study.json
          git commit -m 'Update QUU MR90 strategy study' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
