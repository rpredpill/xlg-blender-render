name: QQQ SPMO Intersection Backtest
on:
  push:
    branches: ['research/qqq-spmo-intersection-backtest']
    paths: ['.github/workflows/qqq-spmo-backtest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect SPMO Atom through Jina
        run: |
          python3 - <<'PY'
          import urllib.request,re
          u='https://r.jina.ai/https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany%26CIK=S000050154%26type=NPORT-P%26dateb=%26owner=include%26count=100%26output=atom'
          t=urllib.request.urlopen(u,timeout=30).read().decode()
          print('LEN',len(t))
          print(t[:12000])
          print('ACCESSIONS',re.findall(r'\d{10}-\d{2}-\d{6}',t))
          PY
