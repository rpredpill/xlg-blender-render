name: QQQ SPMO Top20 Union Price Fetch
on:
  push:
    branches: ['research/qqq-spmo-intersection-backtest']
    paths:
      - 'research/fetch_top20_prices.py'
      - '.github/workflows/qqq-spmo-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'yfinance>=0.2.66,<0.3'
      - name: Fetch candidate prices
        run: python research/fetch_top20_prices.py
      - name: Upload price results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spmo-top20-prices
          path: research/top20_price_output/
          if-no-files-found: error
