name: QQQ SPMO Intersection Backtest

on:
  push:
    branches:
      - 'research/qqq-spmo-intersection-backtest'
    paths:
      - 'research/qqq_spmo_intersection_backtest.py'
      - '.github/workflows/qqq-spmo-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'requests>=2.32,<3' 'yfinance>=0.2.66,<0.3'
      - name: Inspect Jina NPORT
        run: |
          python - <<'PY'
          import requests
          u='https://r.jina.ai/https://www.sec.gov/Archives/edgar/data/1067839/000175272423269960/primary_doc.xml'
          t=requests.get(u,timeout=30).text
          print('LEN',len(t))
          for needle in ['Apple','APPLE','Microsoft','MICROSOFT','03783310','pctVal']:
            i=t.find(needle)
            print('\nNEEDLE',needle,'INDEX',i)
            if i>=0: print(repr(t[max(0,i-1200):i+2200]))
          print('\nTAIL',repr(t[-3000:]))
          PY
      - name: Stop after inspection
        run: echo inspection-complete
