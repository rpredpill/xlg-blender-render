name: Refresh Nani signal and history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nani-signal.yml'
      - 'tools/nani_live.py'
      - 'tools/nani_live_v2.py'
      - 'tools/nani_live_v4.py'
      - 'tools/nani_mtd.py'
      - 'tools/nani_ndx_source.py'
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas yfinance requests lxml

      - name: Load Nani engines from main
        run: |
          git show origin/main:tools/nani_live.py > /tmp/nani_live_legacy.py
          git show origin/main:tools/nani_live_v2.py > /tmp/nani_live_v2.py
          git show origin/main:tools/nani_live_v4.py > /tmp/nani_live_v4.py
          git show origin/main:tools/nani_mtd.py > /tmp/nani_mtd.py
          git show origin/main:tools/nani_ndx_source.py > /tmp/nani_ndx_source.py
          python -m py_compile /tmp/nani_live_legacy.py /tmp/nani_live_v2.py /tmp/nani_live_v4.py /tmp/nani_mtd.py /tmp/nani_ndx_source.py

      - name: Build independent Nasdaq-100 source
        run: python /tmp/nani_ndx_source.py --output /tmp/nani-ndx-source.json

      - name: Build Nani v4 snapshot, MTD and forward-only history
        shell: bash
        run: |
          set -euo pipefail
          cp quu-latest.json /tmp/quu-latest.original.json
          restore_quu() { cp /tmp/quu-latest.original.json quu-latest.json; }
          trap restore_quu EXIT

          python - <<'PY'
          import json
          from pathlib import Path
          ndx=json.load(open('/tmp/nani-ndx-source.json',encoding='utf-8'))
          rows=[{'ticker':s} for s in ndx['symbols']]
          Path('quu-latest.json').write_text(json.dumps({'strategy':'Nani NDX source adapter','holdings':len(rows),'rows':rows},indent=2),encoding='utf-8')
          PY

          python /tmp/nani_live_v4.py --site . --legacy /tmp/nani_live_legacy.py --v2 /tmp/nani_live_v2.py

          python - <<'PY'
          import json
          from pathlib import Path
          ndx=json.load(open('/tmp/nani-ndx-source.json',encoding='utf-8'))
          p=Path('nani-latest.json')
          latest=json.loads(p.read_text(encoding='utf-8'))
          latest.setdefault('sources',{})['nasdaq100']=ndx['source']
          latest['sources']['nasdaq100Method']=ndx['method']
          latest.setdefault('diagnostics',{})['ndxSourceCount']=ndx['count']
          latest['diagnostics']['ndxSourceAsOf']=ndx['asOf']
          p.write_text(json.dumps(latest,ensure_ascii=False,indent=2,allow_nan=False),encoding='utf-8')

          hp=Path('nani-history.json')
          hist=json.loads(hp.read_text(encoding='utf-8'))
          hist['nasdaq100Source']={'source':ndx['source'],'method':ndx['method'],'asOf':ndx['asOf'],'count':ndx['count']}
          hp.write_text(json.dumps(hist,ensure_ascii=False,indent=2,allow_nan=False),encoding='utf-8')
          PY

          restore_quu
          trap - EXIT

          # Display-only current-month return. This does not alter official forward history.
          python /tmp/nani_mtd.py --site . --legacy /tmp/nani_live_legacy.py

      - name: Validate Nani v4 outputs
        shell: python
        run: |
          import json, math
          latest=json.load(open('nani-latest.json',encoding='utf-8'))
          hist=json.load(open('nani-history.json',encoding='utf-8'))
          if latest.get('strategy')!='Nani' or latest.get('version')!='4.0' or latest.get('ready') is not True:
              raise RuntimeError(f"unexpected latest header {latest.get('strategy')} v={latest.get('version')} ready={latest.get('ready')}")
          rows=latest.get('rows') or []
          us=[r for r in rows if r.get('country')=='US']
          jp=[r for r in rows if r.get('country')=='JP']
          d=latest.get('diagnostics') or {}
          if len(jp)!=100 or int(d.get('nikkei100Count') or -1)!=100:
              raise RuntimeError(f'JP100 mismatch rows={len(jp)} diag={d.get("nikkei100Count")}')
          if int(d.get('nikkeiSourceCount') or -1)!=225:
              raise RuntimeError(f'Nikkei source must remain 225 for top100 ranking: {d.get("nikkeiSourceCount")}')
          if len(us)!=int(d.get('ndxSourceCount') or -1) or len(us)!=int(d.get('nasdaqCount') or -1):
              raise RuntimeError(f'US count mismatch rows={len(us)} source={d.get("ndxSourceCount")} diag={d.get("nasdaqCount")}')
          if len(rows)!=len(jp)+len(us) or len(rows)!=int(d.get('unionCount') or -1):
              raise RuntimeError(f'union mismatch rows={len(rows)} JP={len(jp)} US={len(us)} diag={d.get("unionCount")}')
          total=sum(float(x['weight']) for x in rows)
          jp_weight=sum(float(x['weight']) for x in jp)
          us_weight=sum(float(x['weight']) for x in us)
          if not math.isclose(total,1.0,rel_tol=0,abs_tol=1e-8):
              raise RuntimeError(f'weight sum {total}')
          if not math.isclose(jp_weight,0.5,rel_tol=0,abs_tol=1e-8) or not math.isclose(us_weight,0.5,rel_tol=0,abs_tol=1e-8):
              raise RuntimeError(f'country buckets JP={jp_weight} US={us_weight}')
          rules=latest.get('rules') or {}
          if rules.get('countryAllocation')!='Japan 50% / US 50%':
              raise RuntimeError(f'country allocation rule missing: {rules}')
          if rules.get('coreWeighting')!='Float-Adjusted Market Cap only' or rules.get('momentum') is not None:
              raise RuntimeError(f'float-only rule mismatch: {rules}')
          if rules.get('singleNameCap') is not None or rules.get('rebalanceCadence') is not None:
              raise RuntimeError(f'Nani core must not inherit cap/cadence: {rules}')
          checked=0
          for r in rows:
              fc=r.get('floatCap'); raw=r.get('rawWeightScore')
              if all(isinstance(v,(int,float)) and math.isfinite(float(v)) for v in [fc,raw]):
                  expected=float(fc)
                  if not math.isclose(float(raw),expected,rel_tol=1e-12,abs_tol=max(1e-4,abs(expected)*1e-12)):
                      raise RuntimeError(f'raw score mismatch {r.get("ticker")}: {raw} vs {expected}')
                  if any(k in r for k in ['momentum','grossMomentum','relativeMomentum','earlyPrice']):
                      raise RuntimeError(f'momentum field survived in v4 row {r.get("ticker")}')
                  checked+=1
          if checked!=len(rows):
              raise RuntimeError(f'formula rows checked {checked}/{len(rows)}')

          mtd=latest.get('currentMonthMTD') or {}
          if mtd.get('ready'):
              if float(mtd.get('coverageRatio',0))<0.98:
                  raise RuntimeError(f'MTD coverage too low {mtd.get("coverageRatio")}')
              if len(mtd.get('rows') or [])!=len(rows):
                  raise RuntimeError(f'MTD row count mismatch {len(mtd.get("rows") or [])}/{len(rows)}')
              if not isinstance(mtd.get('portfolioReturn'),(int,float)):
                  raise RuntimeError('MTD portfolio return missing')

          months=hist.get('months') or {}
          bad=[m for m,r in months.items() if not isinstance(r,dict) or r.get('provenance')!='forward-live-v4']
          if bad:
              raise RuntimeError(f'non-v4 forward Nani history remains: {bad}')
          for m,r in months.items():
              rrows=r.get('rows') or []
              rjp=sum(float(x.get('weight',0)) for x in rrows if x.get('country')=='JP')
              rus=sum(float(x.get('weight',0)) for x in rrows if x.get('country')=='US')
              if not math.isclose(rjp,0.5,rel_tol=0,abs_tol=2e-8) or not math.isclose(rus,0.5,rel_tol=0,abs_tol=2e-8):
                  raise RuntimeError(f'{m} country bucket mismatch JP={rjp} US={rus}')
          completed=[m for m,r in months.items() if isinstance(r.get('portfolioReturn'),(int,float))]
          pending=[m for m,r in months.items() if not isinstance(r.get('portfolioReturn'),(int,float))]
          print('Nani v4', latest.get('allocationMonth'))
          print('holdings',len(rows),'JP',len(jp),'US',len(us),'JPWeight',jp_weight,'USWeight',us_weight,'maxWeight',latest.get('maxWeight'))
          print('floatOnlyRowsChecked',checked)
          print('MTD',mtd.get('month'),'ready',mtd.get('ready'),'asOf',mtd.get('asOfDate'),'return',mtd.get('portfolioReturn'),'coverage',mtd.get('coverageRatio'))
          print('history completed',completed,'pending',pending)

      - name: Commit Nani outputs to Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nani-latest.json nani-history.json
          if git diff --cached --quiet; then
            echo 'No Nani output changes'
            exit 0
          fi
          git commit -m 'Refresh Nani v4 signal, MTD and history'
          git fetch origin somx-pages
          git rebase origin/somx-pages
          git push origin HEAD:somx-pages
