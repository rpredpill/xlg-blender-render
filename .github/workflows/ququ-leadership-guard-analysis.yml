name: QUQU leadership crash guard analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ququ-leadership-guard-analysis.yml'
      - 'tools/ququ_leadership_guard_analysis.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Load analysis script
        run: git show origin/main:tools/ququ_leadership_guard_analysis.py > /tmp/ququ_leadership_guard_analysis.py
      - name: Run analysis
        run: python /tmp/ququ_leadership_guard_analysis.py
      - name: Validate
        shell: python
        run: |
          import json
          j=json.load(open('ququ-leadership-guard-analysis.json',encoding='utf-8'))
          assert j['period']['months'] >= 36
          for n in ['QUQU p=3','QQQ','Leadership p3/QQQ','Leadership + breadth guard p3/QQQ','Leadership + extreme-dispersion guard p3/QQQ']:
              assert isinstance(j['variants'][n]['CAGRpct'], (int,float))
              assert isinstance(j['variants'][n]['MDDpct'], (int,float))
          print(json.dumps({'variants':j['variants'],'baselineMDDTroughSignal':j['baselineMDDTroughSignal'],'extremeGuardChangedMonths':j['extremeGuardChangedMonths']},indent=2))
      - name: Commit result to Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ququ-leadership-guard-analysis.json
          git commit -m 'Update QUQU leadership crash-guard analysis' || exit 0
          git pull --rebase origin somx-pages
          git push origin HEAD:somx-pages
