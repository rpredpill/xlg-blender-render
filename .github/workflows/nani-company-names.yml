name: Refresh Nani company names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nani-company-names.yml'
      - 'tools/nani_company_names.py'
  workflow_run:
    workflows: ['Refresh Nani signal and history']
    types: [completed]

permissions:
  contents: write

jobs:
  names:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests lxml yfinance

      - name: Load metadata builder
        run: git show origin/main:tools/nani_company_names.py > /tmp/nani_company_names.py

      - name: Build company names
        run: python /tmp/nani_company_names.py --site .

      - name: Validate metadata
        shell: python
        run: |
          import json
          j=json.load(open('nani-company-names.json',encoding='utf-8'))
          if j.get('strategy')!='Nani':
              raise RuntimeError('wrong strategy')
          if float(j.get('coverageRatio',0))<0.95:
              raise RuntimeError(f"name coverage too low {j.get('coverageRatio')} missing={j.get('missing')}")
          print('Nani names',j.get('count'),'/',j.get('expected'),'coverage',j.get('coverageRatio'))

      - name: Commit metadata to Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nani-company-names.json
          if git diff --cached --quiet; then
            echo 'No company-name changes'
            exit 0
          fi
          git commit -m 'Refresh Nani company names'
          git fetch origin somx-pages
          git rebase origin/somx-pages
          git push origin HEAD:somx-pages
