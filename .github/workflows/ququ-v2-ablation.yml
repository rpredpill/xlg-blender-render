name: QUQU v2 ablation

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: 'First allocation month YYYY-MM'
        required: false
        default: '2022-10'
      end_month:
        description: 'Last allocation month YYYY-MM'
        required: false
        default: '2026-09'
  workflow_run:
    workflows: ['Build Nasdaq Composite PIT universe']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ququ-v2-ablation
  cancel-in-progress: true

jobs:
  ablation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: somx-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas yfinance requests

      - name: Load ablation engine from main
        run: git show origin/main:tools/ququ_v2_ablation.py > /tmp/ququ_v2_ablation.py

      - name: Run QUQU v2 ablation
        shell: bash
        env:
          START_MONTH: ${{ github.event.inputs.start_month || '2022-10' }}
          END_MONTH: ${{ github.event.inputs.end_month || '2026-09' }}
        run: |
          set -euo pipefail
          test -s nasdaq-composite-pit.json
          test -s ququ-history.json
          python /tmp/ququ_v2_ablation.py \
            --pit nasdaq-composite-pit.json \
            --legacy ququ-history.json \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --output ququ-v2-ablation.json \
            --workers 8

      - name: Validate ablation output
        shell: python
        run: |
          import json
          p=json.load(open('ququ-v2-ablation.json', encoding='utf-8'))
          names=['Composite TotalCap base','+ FloatCap','+ Vol','+ Liquidity','+ Winsorization']
          m=p.get('metrics') or {}
          missing=[x for x in names if x not in m]
          if missing:
              raise RuntimeError(f'missing variants: {missing}')
          n=p.get('period',{}).get('successfulMonths',0)
          if n < 12:
              raise RuntimeError(f'only {n} successful months')
          print('period', p['period'])
          for name in names:
              x=m[name]
              print(name, 'CAGR', x.get('CAGRpct'), 'MDD', x.get('MDDpct'), 'Sharpe', x.get('Sharpe0rf'), 'Turnover annual', x.get('annualizedTurnoverPct'))
          print('failures', p.get('failures'))

      - name: Commit ablation result to Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ququ-v2-ablation.json
          if git diff --cached --quiet; then
            echo 'No ablation changes'
          else
            git commit -m 'Update QUQU v2 ablation'
            git push origin HEAD:somx-pages
          fi
